<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Слово — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.wgrid{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;gap:6px}
.wcell{
  width:52px;height:52px;border-radius:10px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;text-transform:uppercase;transition:.15s;
}
.wcell.fill{border-color:#3a4c74;animation:wpop .12s ease}
@keyframes wpop{50%{transform:scale(1.08)}}
.wcell.good{background:rgba(52,245,165,.85);border-color:transparent;color:#04231a}
.wrow.wshake{animation:wshake .3s ease}
@keyframes wshake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.wcell.mid{background:rgba(255,209,102,.85);border-color:transparent;color:#221a04}
.wcell.bad{background:#1c2438;border-color:transparent;color:#5a6a8a;opacity:.7}
.wkb{display:flex;flex-direction:column;gap:5px;align-items:center;margin-top:4px}
.wkrow{display:flex;gap:4px}
.wkey{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  min-width:30px;height:44px;border-radius:8px;cursor:pointer;font-weight:800;font-size:14px;
  transition:.1s;font-family:inherit;text-transform:uppercase;
}
.wkey.wide{min-width:52px;font-size:12px}
.wkey.good{background:rgba(52,245,165,.85);color:#04231a;border-color:transparent}
.wkey.mid{background:rgba(255,209,102,.85);color:#221a04;border-color:transparent}
.wkey.bad{opacity:.3;pointer-events:none}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
