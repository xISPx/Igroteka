<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Гомоку — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚫</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.gboard{
  display:grid;grid-template-columns:repeat(15,1fr);gap:1px;
  background:#1a2540;border:1px solid var(--line);border-radius:12px;padding:5px;
  width:min(94vw,430px);
}
.gcell{
  aspect-ratio:1;background:#0c1222;cursor:pointer;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
}
.gcell:hover{background:#182444}
.gcell .stone{width:78%;height:78%;border-radius:50%;animation:gdrop .15s ease}
@keyframes gdrop{from{transform:scale(.3)}to{transform:scale(1)}}
.gcell .stone.b{background:radial-gradient(circle at 35% 30%,#5a688a,#0d1220);border:1px solid #45527000}
.gcell .stone.w{background:radial-gradient(circle at 35% 30%,#ffffff,#b9c4d8)}
.gcell.lastg{box-shadow:inset 0 0 0 2px rgba(255,209,102,.6)}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
