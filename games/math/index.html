<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Счёт — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.expr{font-size:clamp(34px,9vw,52px);font-weight:900;font-variant-numeric:tabular-nums;min-height:70px;display:flex;align-items:center}
.mopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(80vw,360px)}
.mopt{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  color:var(--text);font-size:24px;font-weight:900;padding:16px;cursor:pointer;
  font-variant-numeric:tabular-nums;transition:.12s;font-family:inherit;
}
.mopt:hover{border-color:var(--accent);transform:translateY(-2px)}
.combo2{color:var(--gold);font-weight:800;font-size:14px;min-height:20px}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
<script src="../../js/lang-en.js"></script>
<script src="../../js/i18n.js"></script>
</body>
</html>
