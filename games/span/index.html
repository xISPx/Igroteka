<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Цепочка — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.seq{
  font-size:clamp(30px,8vw,46px);font-weight:900;letter-spacing:8px;
  font-variant-numeric:tabular-nums;color:var(--accent);
  min-height:64px;display:flex;align-items:center;
  text-shadow:0 0 22px rgba(52,245,165,.4);
}
.seqinput{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font-size:24px;font-weight:800;letter-spacing:6px;
  padding:12px 18px;width:220px;text-align:center;font-family:inherit;outline:none;
}
.seqinput:focus{border-color:var(--accent)}
.seqbtn{align-self:center}
.lives{color:var(--danger);font-size:18px;letter-spacing:2px}
.status2{color:var(--muted);font-size:14px;min-height:20px}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
