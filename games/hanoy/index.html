<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Ханой — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗼</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.towers{display:flex;gap:22px;align-items:flex-end;padding:10px}
.tower{
  position:relative;width:120px;height:230px;cursor:pointer;
  border-bottom:4px solid var(--line);border-radius:0 0 12px 12px;
  transition:.15s;
}
.tower::before{
  content:"";position:absolute;left:50%;top:6px;bottom:4px;width:6px;
  transform:translateX(-50%);background:var(--line);border-radius:3px;
}
.tower:hover{background:rgba(52,245,165,.05)}
.tower.sel{background:rgba(52,245,165,.12);box-shadow:0 0 22px rgba(52,245,165,.2)}
.tower .tname{position:absolute;bottom:-26px;width:100%;text-align:center;color:var(--muted);font-size:12px}
.disc{
  position:absolute;left:50%;transform:translateX(-50%);
  height:26px;border-radius:13px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
  transition:bottom .15s ease;
}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
<script src="../../js/lang-en.js"></script>
<script src="../../js/i18n.js"></script>
</body>
</html>
