<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Код — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.code-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.crow{display:flex;gap:14px;align-items:center;background:#0b101e;border:1px solid #1b2436;border-radius:14px;padding:8px 12px}
.crow.act{border-color:#34f5a5;box-shadow:0 0 14px rgba(52,245,165,.25)}
.peg{width:30px;height:30px;border-radius:50%;background:#141b2c;box-shadow:inset 0 0 0 2px #1f2a40}
.peg .fill{width:100%;height:100%;border-radius:50%}
.hints4{display:grid;grid-template-columns:12px 12px;gap:4px}
.hp{width:12px;height:12px;border-radius:50%;background:#141b2c}
.hp.hit{background:#34f5a5}.hp.near{background:#ffd166}
.num{color:#8ea0bf;font-size:12px;width:18px;text-align:right}
.palette{display:flex;gap:10px}
.pal{width:34px;height:34px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.pal:hover{transform:scale(1.1)}
.legend{color:#8ea0bf;font-size:12px;display:flex;gap:14px;align-items:center}
.legend .dotd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js"></script>
<script src="../../js/lang-en.js"></script>
<script src="../../js/i18n.js"></script>
</body>
</html>
