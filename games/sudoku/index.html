<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Судоку — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔟</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.sgrid{
  display:grid;grid-template-columns:repeat(9,1fr);gap:0;
  width:min(92vw,410px);border:2px solid var(--line);border-radius:10px;overflow:hidden;
  background:var(--line);
}
.scell{
  aspect-ratio:1;background:#0e1526;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(15px,4vw,22px);cursor:pointer;position:relative;
  font-variant-numeric:tabular-nums;
}
.scell.fix{color:#7ef0d0;cursor:default}
.scell.user{color:var(--text)}
.scell.bad{color:var(--danger)}
.scell.sel{box-shadow:inset 0 0 0 2px var(--accent);z-index:1}
.scell.br{border-right:1px solid #22304e}
.scell.bb{border-bottom:1px solid #22304e}
.snum{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.snum button{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font-weight:900;font-size:18px;cursor:pointer;
  font-family:inherit;
}
.snum button:hover{border-color:var(--accent)}
.snum button.del{width:auto;padding:0 14px;color:var(--danger)}
.timerow{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
