<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Виселица — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.hwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.word2{
  font-size:clamp(24px,6vw,36px);font-weight:900;letter-spacing:8px;
  font-variant-numeric:tabular-nums;min-height:50px;
}
.word2 .miss{color:var(--danger);text-decoration:underline}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}
.krow{display:flex;gap:4px;justify-content:center}
.key{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  min-width:32px;height:40px;border-radius:8px;cursor:pointer;font-weight:800;
  font-size:16px;transition:.1s;font-family:inherit;
}
.key:hover{border-color:var(--accent)}
.key.hit{background:rgba(52,245,165,.15);border-color:var(--accent);color:var(--accent)}
.key.miss{opacity:.3;pointer-events:none}
.gal{width:130px;height:170px}
.mist{color:var(--danger);font-size:13px;min-height:18px}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
