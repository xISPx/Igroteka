<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Точки — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.dgrid{
  display:grid;gap:0;width:min(92vw,420px);
  grid-template-columns:repeat(9,1fr);
}
.dot{aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.dot::after{content:"";width:30%;height:30%;border-radius:50%;background:#4a5b85}
.edge{cursor:pointer;position:relative}
.edge.h{aspect-ratio:2.4/1;align-self:center}
.edge.v{aspect-ratio:1/2.4;justify-self:center;width:40%}
.edge::after{
  content:"";position:absolute;background:#1a2540;border-radius:3px;inset:15%
}
.edge:hover::after{background:#2a3a60}
.edge.taken-p::after{background:var(--accent)}
.edge.taken-a::after{background:#ff5d6c}
.box{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;animation:bwin .3s ease}
@keyframes bwin{50%{transform:scale(1.3)}}
.box.p{color:var(--accent);background:rgba(52,245,165,.08);border-radius:8px}
.box.a{color:#ff5d6c;background:rgba(255,93,108,.08);border-radius:8px}
.status5{color:var(--muted);font-size:13px;font-weight:700;min-height:18px}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
<script src="../../js/lang-en.js"></script>
<script src="../../js/i18n.js"></script>
</body>
</html>
