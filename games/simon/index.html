<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Мелодия — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back-btn" href="../../index.html">← Игры</a>
    <h1 class="logo">🎵 МЕЛОДИЯ</h1>
    <div class="nav-right">
      <button id="soundBtn" class="icon-btn" title="Звук (M)">🔊</button>
    </div>
  </header>

  <section class="hud">
    <div class="stat"><span class="label">Уровень</span><span class="value" id="level">0</span></div>
    <div class="stat"><span class="label">Рекорд</span><span class="value" id="best">0</span></div>
  </section>

  <section class="board" id="board">
    <p class="status" id="status">Нажми «Играть» и слушай</p>
    <div class="sgrid" id="sgrid">
      <button class="pad p0" data-i="0"></button>
      <button class="pad p1" data-i="1"></button>
      <button class="pad p2" data-i="2"></button>
      <button class="pad p3" data-i="3"></button>
    </div>

    <div class="overlay" id="menuOverlay">
      <div class="panel">
        <h2 class="menu-title">МЕЛОДИЯ</h2>
        <p class="subtitle">Запоминай последовательность нот и повторяй её</p>
        <p class="best-line">Рекорд: <b id="menuBest">0</b></p>
        <button class="btn primary" id="playBtn">▶ Играть</button>
        <p class="tiny-hint">Клавиши 1–4 или клик по кнопкам</p>
      </div>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <div class="panel">
        <h2 class="over-title">СБОЙ!</h2>
        <p class="subtitle">Последовательность нарушена</p>
        <div class="record" id="recordBadge">🏆 Новый рекорд!</div>
        <div class="final-score" id="finalLevel">0</div>
        <p class="subtitle">уровней пройдено</p>
        <div class="row">
          <button class="btn primary" id="restartBtn">Заново</button>
          <button class="btn ghost" id="overMenuBtn">В меню</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="hints">
    <span><kbd>1</kbd>–<kbd>4</kbd> нажать кнопку</span>
    <span>С каждым уровнем мелодия длиннее и быстрее</span>
  </footer>
</main>

<script src="../../js/audio.js"></script>
<script src="js/game.js"></script>
<script src="../../js/rules.js"></script>
<script>Rules.init(`Кнопки загораются в определённом порядке и звучат нотами — запомни.
Повтори последовательность кликами или клавишами 1–4.
Каждый уровень добавляет ноту и ускоряет показ. Одна ошибка — конец. Рекорд — уровень.`);</script>
</body>
</html>
