<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Быки и коровы — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.binput{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  color:var(--text);font-size:24px;font-weight:800;letter-spacing:10px;
  padding:12px;width:180px;text-align:center;font-family:inherit;outline:none;
}
.binput:focus{border-color:var(--accent)}
.blog{display:flex;flex-direction:column;gap:6px;width:min(84vw,360px);max-height:300px;overflow-y:auto}
.brow{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;
}
.bg{font-weight:900;font-size:18px;letter-spacing:6px}
.bscore{color:var(--muted);font-size:13px;white-space:nowrap}
.bscore b{color:var(--accent)}
.bscore .cow{color:var(--gold)}
.bhint{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
