<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Астероиды — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back-btn" href="../../index.html">← Игры</a>
    <h1 class="logo">🚀 АСТЕРОИДЫ</h1>
    <div class="nav-right">
      <button id="soundBtn" class="icon-btn" title="Звук (M)">🔊</button>
    </div>
  </header>

  <section class="hud">
    <div class="stat"><span class="label">Счёт</span><span class="value" id="score">0</span></div>
    <div class="stat"><span class="label">Рекорд</span><span class="value" id="best">0</span></div>
    <div class="stat"><span class="label">Волна</span><span class="value" id="level">1</span></div>
    <div class="stat"><span class="label">Корабли</span><span class="value lives" id="lives">●●●</span></div>
  </section>

  <section class="board" id="board">
    <canvas id="game"></canvas>

    <div class="overlay" id="menuOverlay">
      <div class="panel">
        <h2 class="menu-title">АСТЕРОИДЫ</h2>
        <p class="subtitle">Пилотируй корабль, разбивай камни, не дай себя настигнуть</p>
        <p class="best-line">Рекорд: <b id="menuBest">0</b></p>
        <button class="btn primary" id="playBtn">▶ Играть</button>
        <p class="tiny-hint">← → поворот · ↑ тяга · Пробел — огонь</p>
      </div>
    </div>

    <div class="overlay hidden" id="pauseOverlay">
      <div class="panel">
        <h2 class="pause-title">ПАУЗА</h2>
        <div class="row">
          <button class="btn primary" id="resumeBtn">Продолжить</button>
          <button class="btn ghost" id="pauseMenuBtn">В меню</button>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <div class="panel">
        <h2 class="over-title">КОРАБЛЬ ПОТЕРЯН</h2>
        <div class="record" id="recordBadge">🏆 Новый рекорд!</div>
        <div class="final-score" id="finalScore">0</div>
        <div class="over-stats">
          <div class="stat"><span class="label">Волна</span><span class="value" id="statLevel">1</span></div>
        </div>
        <div class="row">
          <button class="btn primary" id="restartBtn">Заново</button>
          <button class="btn ghost" id="overMenuBtn">В меню</button>
        </div>
        <p class="tiny-hint">Enter — заново</p>
      </div>
    </div>
  </section>

  <footer class="hints">
    <span><kbd>←</kbd><kbd>→</kbd> поворот</span>
    <span><kbd>↑</kbd> тяга</span>
    <span><kbd>Пробел</kbd> огонь</span>
    <span><kbd>P</kbd> пауза</span>
  </footer>
</main>

<script src="../../js/audio.js"></script>
<script src="js/game.js"></script>
<script src="../../js/rules.js"></script>
<script>Rules.init(`← → — поворот, ↑ — тяга (корабль скользит по инерции!), Пробел — выстрел, P — пауза.
Большой астероид распадается на два средних, средний — на два малых. Мелкие дают больше очков (100).
Столкновение отнимает корабль (их три); после гибели — пара секунд неуязвимости.
Расчистил поле — новая волна: камней больше и они быстрее.`);</script>
<script src="../../js/lang-en.js"></script>
<script src="../../js/i18n.js"></script>
</body>
</html>
