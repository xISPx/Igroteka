<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Кроты — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔨</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back-btn" href="../../index.html">← Игры</a>
    <h1 class="logo">🔨 КРОТЫ</h1>
    <div class="nav-right">
      <button id="soundBtn" class="icon-btn" title="Звук (M)">🔊</button>
    </div>
  </header>

  <section class="hud">
    <div class="stat"><span class="label">Счёт</span><span class="value" id="score">0</span></div>
    <div class="stat"><span class="label">Время</span><span class="value" id="time">0:30</span></div>
    <div class="stat"><span class="label">Рекорд</span><span class="value" id="best">0</span></div>
  </section>

  <section class="board" id="board">
    <div class="holes" id="holes"></div>

    <div class="overlay" id="menuOverlay">
      <div class="panel">
        <h2 class="menu-title">КРОТЫ</h2>
        <p class="subtitle">30 секунд: успей прихлопнуть как можно больше кротов</p>
        <p class="tiny-hint golden-hint">✨ Золотой крот = +3 очка</p>
        <p class="best-line">Рекорд: <b id="menuBest">0</b></p>
        <button class="btn primary" id="playBtn">▶ Играть</button>
      </div>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <div class="panel">
        <h2 class="over-title">ВРЕМЯ ВЫШЛО!</h2>
        <div class="record" id="recordBadge">🏆 Новый рекорд!</div>
        <div class="final-score" id="finalScore">0</div>
        <div class="row">
          <button class="btn primary" id="restartBtn">Заново</button>
          <button class="btn ghost" id="overMenuBtn">В меню</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="hints">
    <span><kbd>Клик</kbd> / тап — удар молотком</span>
    <span>Золотые кроты дороже</span>
    <span>Кроты появляются всё быстрее</span>
  </footer>
</main>

<script src="../../js/audio.js"></script>
<script src="js/game.js"></script>
<script src="../../js/rules.js"></script>
<script>Rules.init(`30 секунд на раунд. Кроты выскакивают из нор — клик или тап, чтобы прихлопнуть.
Обычный крот — +1, золотой хомяк — +3.
К концу раунда кроты появляются чаще и прячутся быстрее.`);</script>
</body>
</html>
