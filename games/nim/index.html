<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Ним — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥢</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.rows{display:flex;flex-direction:column;gap:20px;padding:24px}
.nrow{display:flex;gap:9px;justify-content:center;min-height:46px}
.stick{
  width:15px;height:46px;border-radius:8px;cursor:pointer;
  background:linear-gradient(180deg,#ffe9a8,#f4b23e);
  box-shadow:0 0 12px rgba(255,209,102,.3);
  transition:.12s;
}
.stick:hover{transform:translateY(-4px);filter:brightness(1.12)}
.stick.dead{opacity:.15;pointer-events:none;transform:none;filter:none}
.rlabel{color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:-12px}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
