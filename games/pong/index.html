<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Понг — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏓</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back-btn" href="../../index.html">← Игры</a>
    <h1 class="logo">🏓 ПОНГ</h1>
    <div class="nav-right">
      <button id="soundBtn" class="icon-btn" title="Звук (M)">🔊</button>
    </div>
  </header>

  <section class="hud">
    <div class="stat"><span class="label">Вы</span><span class="value" id="p1">0</span></div>
    <div class="stat"><span class="label">ИИ</span><span class="value" id="p2">0</span></div>
    <div class="stat"><span class="label">Победы</span><span class="value" id="wins">0</span></div>
  </section>

  <section class="board" id="board">
    <canvas id="game"></canvas>

    <div class="overlay" id="menuOverlay">
      <div class="panel">
        <h2 class="menu-title">ПОНГ</h2>
        <p class="subtitle">Классическая дуэль: обыграй ИИ со счётом 7:×</p>
        <p class="best-line">Побед всего: <b id="menuWins">0</b></p>
        <button class="btn primary" id="playBtn">▶ Играть</button>
        <p class="tiny-hint">Мышь / палец / ↑↓ — ракетка</p>
      </div>
    </div>

    <div class="overlay hidden" id="pauseOverlay">
      <div class="panel">
        <h2 class="pause-title">ПАУЗА</h2>
        <div class="row">
          <button class="btn primary" id="resumeBtn">Продолжить</button>
          <button class="btn ghost" id="pauseMenuBtn">В меню</button>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <div class="panel">
        <h2 class="over-title" id="overTitle">ПОБЕДА!</h2>
        <p class="cause" id="causeText">7:3</p>
        <div class="record" id="recordBadge">🏆 Первая победа!</div>
        <div class="row">
          <button class="btn primary" id="restartBtn">Ещё матч</button>
          <button class="btn ghost" id="overMenuBtn">В меню</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="hints">
    <span><kbd>Мышь</kbd> / <kbd>↑</kbd><kbd>↓</kbd> / <kbd>W</kbd><kbd>S</kbd> ракетка</span>
    <span><kbd>P</kbd> пауза</span>
    <span>на телефоне — палец</span>
  </footer>
</main>

<script src="../../js/audio.js"></script>
<script src="js/game.js"></script>
<script src="../../js/rules.js"></script>
<script>Rules.init(`Мышь, ↑↓ (W/S) или палец — твоя ракетка слева.
Матч до 7 очков. Мяч ускоряется с каждым отбиванием.
Угол отскока зависит от точки удара: края ракетки отбивают острее.
ИИ следит за мячом, но его скорость ограничена — выигрывай позицию заранее.`);</script>
</body>
</html>
