<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Поток — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.flowboard{display:grid;gap:4px;background:#0b101e;padding:14px;border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{width:44px;height:44px;border-radius:10px;background:#101728;position:relative}
.cell.end{box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.cell .dot{position:absolute;inset:26%;border-radius:50%}
.c0{background:linear-gradient(135deg,#ff5d6c,#ff8a5d)}
.c1{background:linear-gradient(135deg,#34f5a5,#a8f55d)}
.c2{background:linear-gradient(135deg,#4da3ff,#4dd7ff)}
.c3{background:linear-gradient(135deg,#ffd166,#ffb84d)}
.c4{background:linear-gradient(135deg,#b388ff,#ff5dd0)}
.c5{background:linear-gradient(135deg,#ff9f43,#ffd166)}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js"></script>
<script src="../../js/lang-en.js"></script>
<script src="../../js/i18n.js"></script>
</body>
</html>
