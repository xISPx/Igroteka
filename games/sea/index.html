<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Морской бой — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚢</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.boards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.sboard{display:flex;flex-direction:column;gap:6px;align-items:center}
.slabel{color:var(--muted);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.sgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(42vw,220px)}
.scell{
  aspect-ratio:1;background:#101a30;border-radius:4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:11px;
}
.enemy .scell:hover{background:#1c2c50}
.scell.ship{background:#2a3654}
.scell.hit{background:rgba(255,93,108,.8);cursor:default}
.scell.sunk{background:#5d1d2a;cursor:default}
.scell.miss{background:#0c1222;color:#4a5b85;cursor:default}
.scell.miss::after{content:"•"}
.status3{color:var(--muted);font-size:14px;min-height:20px;font-weight:700}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
<script src="../../js/lang-en.js"></script>
<script src="../../js/i18n.js"></script>
</body>
</html>
