<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Выключи свет — Игротека</title>

<link rel="stylesheet" href="../../css/common.css">
<style>
.lgrid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
  width:min(84vw,380px);padding:10px;
}
.lcell{
  aspect-ratio:1;border-radius:14px;cursor:pointer;transition:.18s;
  background:#101a30;border:1px solid var(--line);
}
.lcell.on{
  background:radial-gradient(circle at 35% 30%, #fff3c9, #f4b23e);
  box-shadow:0 0 22px rgba(255,209,102,.65);
  border-color:transparent;
}
.lcell:hover{transform:scale(1.05)}
</style>
</head>
