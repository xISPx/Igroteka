<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Крестики-нолики — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭕</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back-btn" href="../../index.html">← Игры</a>
    <h1 class="logo">⭕ КРЕСТИКИ</h1>
    <div class="nav-right">
      <button id="soundBtn" class="icon-btn" title="Звук (M)">🔊</button>
    </div>
  </header>

  <section class="hud">
    <div class="stat"><span class="label">Вы</span><span class="value you" id="sYou">0</span></div>
    <div class="stat"><span class="label">Ничьи</span><span class="value" id="sDraw">0</span></div>
    <div class="stat"><span class="label">ИИ</span><span class="value ai" id="sAi">0</span></div>
    <div class="stat"><span class="label">Всего побед</span><span class="value" id="sTotal">0</span></div>
  </section>

  <section class="board" id="board">
    <p class="status" id="status">Ваш ход — вы играете ✕</p>
    <div class="tgrid" id="tgrid"></div>

    <div class="overlay hidden" id="overOverlay">
      <div class="panel">
        <h2 class="over-title" id="overTitle">ПОБЕДА!</h2>
        <p class="cause" id="causeText"></p>
        <div class="record" id="recordBadge">🏆 Первая победа над ИИ!</div>
        <div class="row">
          <button class="btn primary" id="againBtn">Ещё партия</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="hints">
    <span><kbd>Клик</kbd> поставить знак</span>
    <span>1–9 на клавиатуре</span>
    <span>ИИ непобедим — ничья тоже результат</span>
  </footer>
</main>

<script src="../../js/audio.js"></script>
<script src="js/game.js"></script>
<script src="../../js/rules.js"></script>
<script>Rules.init(`Ты — ✕, ИИ — ◯. Клик по клетке или клавиши 1–9.
ИИ играет идеально (полный перебор): выиграть у него нельзя, ничья — отличный результат.
Первый ход чередуется каждую партию. Счёт сессии + общее число побед сохраняется.`);</script>
<script src="../../js/lang-en.js"></script>
<script src="../../js/i18n.js"></script>
</body>
</html>
