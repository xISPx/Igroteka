<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Сапёр — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back-btn" href="../../index.html">← Игры</a>
    <h1 class="logo">💣 САПЁР</h1>
    <div class="nav-right">
      <button id="soundBtn" class="icon-btn" title="Звук (M)">🔊</button>
    </div>
  </header>

  <section class="diff-row" id="diffRow">
    <button class="diff active" data-diff="easy"><b>Новичок</b><i>9×9 · 10 мин</i></button>
    <button class="diff" data-diff="medium"><b>Любитель</b><i>16×16 · 40 мин</i></button>
    <button class="diff" data-diff="hard"><b>Профи</b><i>30×16 · 99 мин</i></button>
  </section>

  <section class="hud">
    <button id="faceBtn" class="icon-btn face" title="Новая игра">🙂</button>
    <div class="stat"><span class="label">Мины</span><span class="value" id="mines">10</span></div>
    <div class="stat"><span class="label">Время</span><span class="value" id="time">0:00</span></div>
    <div class="stat"><span class="label">Рекорд</span><span class="value" id="best">—</span></div>
    <button id="flagBtn" class="icon-btn" title="Режим флажков">🚩</button>
  </section>

  <section class="board" id="board">
    <div class="msboard" id="msboard"></div>

    <div class="overlay hidden" id="winOverlay">
      <div class="panel">
        <h2 class="menu-title">ЧИСТО!</h2>
        <p class="subtitle">Все мины разминированы</p>
        <div class="record" id="recordBadge">🏆 Новый рекорд!</div>
        <div class="final-score" id="finalTime">0:00</div>
        <div class="row">
          <button class="btn primary" id="againBtn">Заново</button>
          <button class="btn ghost" id="winMenuBtn">Сменить поле</button>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="loseOverlay">
      <div class="panel">
        <h2 class="over-title">БУМ!</h2>
        <p class="subtitle" id="loseSub">Мина взорвалась</p>
        <div class="row">
          <button class="btn primary" id="retryBtn">Заново</button>
          <button class="btn ghost" id="loseMenuBtn">Сменить поле</button>
        </div>
        <p class="tiny-hint">Enter — заново</p>
      </div>
    </div>
  </section>

  <footer class="hints">
    <span><kbd>ЛКМ</kbd> открыть</span>
    <span><kbd>ПКМ</kbd> флажок</span>
    <span><kbd>2×ЛКМ</kbd> открыть соседей</span>
    <span>долгое нажатие — флажок</span>
  </footer>
</main>

<script src="../../js/audio.js"></script>
<script src="js/game.js"></script>
<script src="../../js/rules.js"></script>
<script>Rules.init(`ЛКМ — открыть клетку, ПКМ — флажок (на телефоне — долгое нажатие).
Первый клик всегда безопасен: мины расставляются после него, рядом с первым открытием мин не будет.
Цифра = число мин в 8 соседних клетках. Открытая цифра + двойной клик откроет соседей, если флажков вокруг ровно столько же.
Открой все клетки без мин — победа. Ошибочные флажки помечаются ❌ при взрыве.
Рекорд — лучшее время для каждой сложности.`);</script>
<script src="../../js/lang-en.js"></script>
<script src="../../js/i18n.js"></script>
</body>
</html>
