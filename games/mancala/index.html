<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>Манкала — Игротека</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫘</text></svg>">
<link rel="stylesheet" href="../../css/common.css">
<style>
.mwrap{display:flex;align-items:center;gap:10px;padding:6px}
.store{
  width:56px;height:170px;border-radius:28px;background:#101a30;
  border:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
}
.store .num{font-size:26px;font-weight:900;color:var(--gold)}
.store .who{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.mcols{display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;gap:10px}
.pit{
  width:52px;height:52px;border-radius:50%;background:#101a30;
  border:1px solid var(--line);cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;color:var(--text);transition:.15s;
}
.pit .pnum{color:var(--accent)}
.pit.aiturn .pnum{color:#ff5d6c}
.pit.mine:not(.empty):hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 0 16px rgba(52,245,165,.25)}
.pit.empty{opacity:.45;cursor:default}
.pit.ai{cursor:default}
.mlabel{color:var(--muted);font-size:10px;text-align:center;letter-spacing:1px;text-transform:uppercase}
.status4{color:var(--muted);font-size:13px;font-weight:700;min-height:18px}
</style>
</head>
<body>
<script src="../../js/audio.js"></script>
<script src="../../js/rules.js"></script>
<script src="../../js/shell.js"></script>
<script src="js/game.js?v=2"></script>
</body>
</html>
